networks:
  rag-net:
    driver: bridge

services:
  postgres:
    # Official image: Postgres 18 with the pgvector extension preinstalled.
    image: pgvector/pgvector:pg18
    container_name: rag-course-postgres
    restart: unless-stopped
    networks:
      - rag-net
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    # No ports: block — postgres is only reachable from within rag-net.
    # The app connects via the service name "postgres" on the internal network.
    # Port 5432 is never bound on the host, eliminating conflict with a local
    # Postgres instance.
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory and
      # expects the mount at /var/lib/postgresql (the parent), not at
      # /var/lib/postgresql/data as in PG 17 and earlier.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: go-rag:latest
    # Wait until Postgres passes its healthcheck before starting the app.
    # Without this, the app can try to connect before Postgres is ready.
    depends_on:
      postgres:
        condition: service_healthy
    # Load API keys and other local settings from .env.
    # DATABASE_URL and HTTP_ADDR are overridden below because their values
    # differ between local dev (localhost) and container (service name / 0.0.0.0).
    # host.docker.internal resolves to the host machine's IP from inside the
    # container. On Linux, this requires the extra_hosts entry below — it is
    # not automatic the way it is on Docker Desktop for Mac/Windows.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      # "postgres" is the service name above — Docker's DNS resolves it
      # inside the container network. Using "localhost" here would point
      # to the app container itself, not the database.
      DATABASE_URL: postgres://rag:rag@postgres:5432/rag
      # Bind to 0.0.0.0 so the port is reachable from outside the container.
      # Binding to 127.0.0.1 (the local-dev default) would make the port
      # unreachable even though it's published below.
      HTTP_ADDR: :8080
      # Replace localhost with host.docker.internal so the container can reach
      # Ollama (or any other service) running on the host machine.
      # The .env file uses localhost, which only works outside the container.
      OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
    # ── Runtime hardening ─────────────────────────────────────────────────────
    # read_only: the container filesystem is immutable. The app can only write
    # to explicitly mounted volumes (./documents below). Prevents malware from
    # dropping files anywhere else in the container.
    read_only: true
    security_opt:
      # Prevents the process from gaining elevated privileges through setuid/setgid
      # binaries. Even if an attacker found one, it could not become root.
      - no-new-privileges:true
    cap_drop:
      # Drop every Linux capability. A Go HTTP server needs none of them.
      # Add individual caps back here if the app ever needs one (e.g. CAP_NET_BIND_SERVICE
      # to bind port 80 without root — not needed since we use port 8080).
      - ALL
    networks:
      - rag-net
    ports:
      # Only the app's HTTP port is published to the host.
      - "8080:8080"
    volumes:
      # Mount the documents directory so ingested files survive container restarts.
      # This is also the only path the app is allowed to write to (read_only: true above).
      - ./documents:/app/documents

volumes:
  pgdata:
