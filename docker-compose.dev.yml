# Development-only compose file — starts Postgres so you can run the app
# locally with `go run ./cmd/rag/` and `go test ./...` without a full
# container stack.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d    # start
#   docker compose -f docker-compose.dev.yml down     # stop
#
# The production stack (docker-compose.yml) is unchanged and unaffected.
# Dev data lives in a separate volume (pgdata-dev) so it never mixes with
# production data.

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: rag-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # Exposed to the host so go run and go test can reach it directly.
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: rag-dev-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
    # On Linux, host.docker.internal requires this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata-dev:
